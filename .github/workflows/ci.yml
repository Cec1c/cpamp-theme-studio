name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "${files}" ]; then
            echo "These Go files need gofmt:" >&2
            echo "${files}" >&2
            exit 1
          fi
      - name: Validate source
        run: |
          go vet ./...
          go test -race ./...
          node --check assets/loader.js
          python -m json.tool registry.json >/dev/null

  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-amd64
            shell: pwsh
          - runner: ubuntu-latest
            target: linux-amd64
            shell: bash
          - runner: macos-latest
            target: darwin-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Build Windows plugin
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Version 0.1.0-dev -Target '${{ matrix.target }}'
      - name: Build Unix plugin
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build.sh 0.1.0-dev '${{ matrix.target }}'
